<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5cab"><title>Quiz Teamcenter</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="wrap"><div class="brand"><h1>Quiz Teamcenter</h1><small id="headInfo"></small></div><div class="progress"><div id="bar"></div></div></div></header><main class="wrap">
<section id="home"><div class="card"><h3>Compte</h3><p class="muted" id="googleStatusStable">Tu peux utiliser le quiz sans connexion.</p><button class="primary" id="googleLoginStable">Se connecter avec Google</button><button class="secondary hidden" id="googleLogoutStable" style="width:100%;margin-top:8px">Se deconnecter</button></div><div class="card"><h2>Que veux-tu réviser ?</h2><div class="grid"><div><label>Module</label><select id="module"></select></div><div><label>Sous-thème</label><select id="subtopic"></select></div></div></div><div class="card"><h3>Mode d’apprentissage</h3><div class="modes"><button class="mode active" data-mode="order">📘 Dans l’ordre <span class="muted">Pour apprendre progressivement</span></button><button class="mode" data-mode="random">🔀 Aléatoire <span class="muted">Pour se tester</span></button><button class="mode" data-mode="errors">🎯 Revoir mes erreurs <span class="muted">Uniquement les réponses incorrectes</span></button></div><br><button class="primary" id="start">Commencer</button></div></section>
<section id="quiz" class="hidden"><div class="card"><div class="question-meta"><span id="topicLabel"></span><span id="counter"></span></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div id="feedback" class="hidden"></div><div class="actions"><button class="secondary" id="quit">Changer de thème</button><button class="primary" id="validate">Valider</button><button class="primary hidden" id="next">Question suivante</button></div></div></section>
<section id="stats" class="hidden"><div class="card"><h2>Mes statistiques</h2><div class="stats-grid"><div class="stat"><b id="sTotal">0</b>réponses</div><div class="stat"><b id="sRate">0%</b>réussite</div><div class="stat"><b id="sErrors">0</b>à revoir</div></div></div><div class="card"><h3>Résultats par module</h3><div id="moduleStats"></div></div><button class="danger" id="resetStats">Effacer les statistiques de cette session</button></section>
</main><nav class="tabs"><button data-tab="home" class="active">🏠<br>Accueil</button><button data-tab="quiz">📝<br>Quiz</button><button data-tab="stats">📊<br>Statistiques</button></nav>
<script src="data/questions.js"></script>
<script src="js/quiz.js"></script>
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/sessions.js"></script></body></html>
